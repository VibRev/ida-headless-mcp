[workspace]
members = ["."]
resolver = "3"

[workspace.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
rmcp = { version = "3.1.2", features = ["server", "client", "transport-io", "transport-child-process", "transport-streamable-http-server", "elicitation", "request-state", "schemars"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "net", "signal", "process", "io-util", "fs"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
bytes = "1"
futures-util = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
tower-service = "0.3"
uuid = { version = "1", features = ["v4"] }
regex = "1.13.1"
num-bigint = "0.5.1"
# Both a build- and a runtime dependency: build.rs packs `skills/` into the
# binary and `skills export` unpacks it. Both halves of that format live in one
# crate on purpose — see its module header.
vibrev-skills = { git = "https://github.com/VibRev/vibrev.git", branch = "main" }
url = "2.5.8"
percent-encoding = "2.3.2"
vibrev-kit = { git = "https://github.com/VibRev/vibrev.git", branch = "main", features = ["http"] }
vibrev-tool-macros = { git = "https://github.com/VibRev/vibrev.git", branch = "main" }
dunce = "1.0.5"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }
cc = "1"

[workspace.lints.clippy]
# Command-line `-D warnings` remains the gate. This table exists so every
# member inherits the same clippy set instead of carrying a private one.
dbg_macro = "deny"

[package]
name = "ida-headless-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Rust-native, multi-session IDA Pro headless MCP server"
license = "Apache-2.0"
authors = ["fuqiuluo", "ida-headless-mcp contributors"]
keywords = ["ida", "mcp", "reverse-engineering", "disassembly", "decompiler"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "ida_mcp"

[[bin]]
name = "ida-headless-mcp"
path = "src/main.rs"

[[bin]]
name = "gen_tools_doc"
path = "src/bin/gen_tools_doc.rs"

[[test]]
name = "tool_surface"
path = "tests/tool_surface.rs"

[features]
# 9.4 is the default because it is the only SDK whose `idalib-sys` headers mark
# their wrappers `inline`. On 9.2 and 9.3 they are plain free functions defined
# in headers, so five translation units each emit a strong definition and the
# link fails without `-Wl,--allow-multiple-definition`. See TODO.md.
default = ["ida-94"]
ida-92 = []
ida-93 = []
ida-94 = ["dep:idalib_94", "dep:idalib_build_94"]

[lints]
workspace = true

[dependencies]
axum.workspace = true
idalib_94 = { package = "idalib", git = "https://github.com/blacktop/idalib.git", branch = "sdk-9.4.0", optional = true }
rmcp.workspace = true
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
libc.workspace = true
bytes.workspace = true
futures-util.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
tower-service.workspace = true
uuid.workspace = true
regex.workspace = true
num-bigint.workspace = true
url.workspace = true
percent-encoding.workspace = true
vibrev-kit.workspace = true
vibrev-skills.workspace = true
vibrev-tool-macros.workspace = true

[target.'cfg(windows)'.dependencies]
dunce.workspace = true
windows-sys.workspace = true

[build-dependencies]
cc.workspace = true
# `default-features = false`: the build script calls `pack` and nothing else, so
# it compiles flate2 for the host and skips clap, serde and anyhow entirely.
# Spelled out again instead of `.workspace = true` because cargo refuses to let
# a member turn off default features on a workspace dependency. The source must
# match the workspace entry exactly or cargo resolves two copies.
vibrev-skills = { git = "https://github.com/VibRev/vibrev.git", branch = "main", default-features = false }
idalib_build_94 = { package = "idalib-build", git = "https://github.com/blacktop/idalib.git", branch = "sdk-9.4.0", optional = true }
