[workspace]

[package]
name = "ida-headless-mcp-ida93"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "IDA 9.3 build of the Rust-native multi-session headless MCP server"
license = "MIT"
authors = ["ida-headless-mcp contributors"]
build = "../../build.rs"

[lib]
name = "ida_mcp"
path = "../../src/lib.rs"

[[bin]]
name = "ida-headless-mcp"
path = "../../src/main.rs"

[[bin]]
name = "gen_tools_doc"
path = "../../src/bin/gen_tools_doc.rs"

[[test]]
name = "tool_surface"
path = "../../tests/tool_surface.rs"

[features]
default = ["ida-93"]
ida-92 = []
ida-93 = ["dep:idalib_93", "dep:idalib_build_93"]
ida-94 = []

[lints.clippy]
dbg_macro = "deny"

[dependencies]
# Versions stay in step with the root [workspace.dependencies].
# These three manifests cannot share one Cargo.lock: each idalib
# revision declares `links = "idalib"`, and Cargo forbids two such
# crates in the same dependency graph.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
idalib_93 = { package = "idalib", git = "https://github.com/blacktop/idalib.git", branch = "sdk-9.3.1", optional = true }
rmcp = { version = "3.1.2", features = ["server", "client", "transport-io", "transport-child-process", "transport-streamable-http-server", "elicitation", "request-state", "schemars"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "net", "signal", "process", "io-util", "fs"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
bytes = "1"
futures-util = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
tower-service = "0.3"
uuid = { version = "1", features = ["v4"] }
regex = "1.13.1"
num-bigint = "0.5.1"
url = "2.5.8"
percent-encoding = "2.3.2"
vibrev-kit = { git = "https://github.com/VibRev/vibrev.git", branch = "main", features = ["http"] }
vibrev-skills = { git = "https://github.com/VibRev/vibrev.git", branch = "main" }
vibrev-tool-macros = { git = "https://github.com/VibRev/vibrev.git", branch = "main" }

[target.'cfg(windows)'.dependencies]
dunce = "1.0.5"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[build-dependencies]
cc = "1"
# See the root manifest: `default-features = false` keeps the build script from
# host-compiling clap/serde/anyhow, and spelling the source out in full is what
# lets a non-workspace member turn those off.
vibrev-skills = { git = "https://github.com/VibRev/vibrev.git", branch = "main", default-features = false }
idalib_build_93 = { package = "idalib-build", git = "https://github.com/blacktop/idalib.git", branch = "sdk-9.3.1", optional = true }
